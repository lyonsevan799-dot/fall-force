<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script id="crazygames-sdk" async src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2L30 16L16 30L2 16Z' fill='%233ae8ff'/%3E%3Cpath d='M11 17L16 11L21 17M11 21L16 15L21 21' fill='none' stroke='%2304050c' stroke-width='2'/%3E%3C/svg%3E" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Gravity Switch — a gravity-flipping arcade runner with 55 Career levels, Tutorial, Endless, Survival, Time Trial, ghosts and local two-player Race." />
    <meta name="theme-color" content="#04050c" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Gravity Switch — Arcade Gravity Runner</title>
    <style>
      html, body { margin: 0; background: #04050c; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="gs-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#04050c;color:#fff;font-family:'Orbitron',Arial,sans-serif;z-index:9999">
        <div style="text-align:center">
          <div style="font-size:10px;letter-spacing:0.6em;text-transform:uppercase;color:rgba(168,242,255,0.6)">Arcade Gravity Runner</div>
          <div style="margin-top:10px;font-size:clamp(20px,5vw,38px);font-weight:900;letter-spacing:0.14em;text-transform:uppercase;text-shadow:0 0 26px rgba(56,232,255,0.45)">GRAVITY SWITCH</div>
          <div style="margin-top:8px;height:2px;width:120px;background:linear-gradient(90deg,transparent,rgba(56,232,255,0.8),transparent)"></div>
        </div>
        <div style="width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:#3ae8ff;border-radius:50%;animation:gs-spin 0.8s linear infinite"></div>
      </div>
      <style>@keyframes gs-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
